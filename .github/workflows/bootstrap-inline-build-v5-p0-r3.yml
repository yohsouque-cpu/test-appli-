  android:
    name: Android APK P0-R3
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SQE_Methodes_P0-R3_Source
      - name: Extract source
        shell: bash
        run: |
          rm -rf work
          mkdir -p work
          unzip -q SQE_Methodes_P0-R3_Source.zip -d work
          test -f work/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install dependencies and validate source
        working-directory: work
        run: |
          npm install --no-audit --no-fund
          npm run test:all
          npm run tauri -- icon app-icon.svg
      - name: Initialize Android
        working-directory: work
        run: npm run tauri -- android init --ci
      - name: Build Android APK
        working-directory: work
        run: npm run tauri -- android build --debug --apk --target aarch64
      - name: Collect Android artifact
        shell: bash
        run: |
          mkdir -p artifacts/android
          APK=$(find work/src-tauri/gen/android -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/android/SQE_Methodes_P0-R3_Android.apk
          sha256sum artifacts/android/SQE_Methodes_P0-R3_Android.apk > artifacts/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SQE_Methodes_P0-R3_Android
          path: artifacts/android/*
          if-no-files-found: error

  windows:
    name: Windows NSIS P0-R3
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SQE_Methodes_P0-R3_Source
      - name: Extract source
        shell: pwsh
        run: |
          if (Test-Path work) { Remove-Item work -Recurse -Force }
          Expand-Archive -Path SQE_Methodes_P0-R3_Source.zip -DestinationPath work
          if (-not (Test-Path 'work/package.json')) { throw 'package.json introuvable dans le ZIP' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and validate source
        working-directory: work
        run: |
          npm install --no-audit --no-fund
          npm run test:all
          npm run tauri -- icon app-icon.svg
      - name: Build Windows installer
        working-directory: work
        run: npm run tauri -- build --bundles nsis
      - name: Collect Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null
          $installer = Get-ChildItem -Path work/src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installateur NSIS introuvable" }
          Copy-Item $installer.FullName -Destination artifacts/windows/SQE_Methodes_P0-R3_Setup.exe
          Get-FileHash artifacts/windows/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SQE_Methodes_P0-R3_Windows
          path: artifacts/windows/*
          if-no-files-found: error
